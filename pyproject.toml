[project]
name = "procfac"
version = "0.1.0"
description = "Lee facturas A en PDF nativo y devuelve un JSON estandarizado validado por el usuario"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "pdfplumber",
    "pydantic>=2",
    "anthropic>=1",
    "python-multipart",
    "python-dotenv",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "fpdf2",
    "jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procfac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not referencia'"
markers = [
    "referencia: usa la API real de Claude y tests/data/",
]

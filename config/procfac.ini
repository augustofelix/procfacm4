# Configuración general de ProcFac. Sin secretos: usuarios, contraseñas y API key van en .env.

[api]
url = http://127.0.0.1:8000
host = 127.0.0.1
puerto = 8000

[ia]
modelo = claude-opus-5-5
esfuerzo = low
timeout_segundos = 60
max_tokens = 16000

[pdf]
max_paginas = 3
min_caracteres_por_pagina = 20
